<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glow Tag — free by wantedasa.dev</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; height:100%; overflow:hidden; display:flex; align-items:center; justify-content:center;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background:#0d1117; color:#e6edf3; }
  .glow-tag{display:inline-block;background:rgba(47,129,247,.10);color:#58a6ff;border:1px solid rgba(47,129,247,.35);padding:6px 14px;border-radius:999px;font-weight:600;font-size:.9rem;animation:tag-glow 3.2s ease-in-out infinite}
  @keyframes tag-glow{0%,100%{box-shadow:0 0 8px rgba(47,129,247,.2)}50%{box-shadow:0 0 16px rgba(47,129,247,.55)}}
  @media(prefers-reduced-motion:reduce){.glow-tag{animation:none}}
</style>
</head>
<body>
<span class="glow-tag">New&nbsp;🚀</span>
</body>
</html>
